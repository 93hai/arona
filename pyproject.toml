[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "arona-core"
version = "3.0.0a1"
description = "Arona 3.0 Core Brain Foundation — candidate"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3"]

[project.scripts]
arona = "arona.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["arona", "arona.*", "migrations", "migrations.*"]
exclude = ["tests*", ".venv*"]

[tool.setuptools.package-data]
migrations = ["versions/*.sql", "README.md"]
"arona.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
